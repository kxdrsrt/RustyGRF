[package]
name = "rgrf-core"
description = "RustyGRF core library: GRF container, codecs, names, verification"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
aes = { version = "0.9.4", default-features = false }
crc32fast = "1.5.5"
encoding_rs = "0.8.44"
flate2 = "1.1.11"
lz4_flex = { version = "0.14.2", default-features = false, features = ["safe-decode", "std"] }
lzma-rust2 = { version = "0.25.0", default-features = false, features = ["encoder", "std"] }
md-5 = "0.11.0"
rayon = "1.12.0"
sha2 = "0.11.1"
thiserror = "2.0.21"
twox-hash = { version = "2.1.5", default-features = false, features = ["xxhash32", "xxhash3_128", "std"] }
unicode-normalization = "0.1.26"
zopfli = { version = "0.8.4", default-features = false, features = ["std", "zlib"] }
