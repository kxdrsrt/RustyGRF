[package]
name = "rgrf-mcp"
description = "RustyGRF MCP server (stdio)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "rgrf-mcp"
path = "src/main.rs"

[lib]
name = "rgrf_mcp"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
encoding_rs = "0.8.44"
rayon = "1.12.0"
rgrf-core = { path = "../rgrf-core" }
rgrf-formats = { path = "../rgrf-formats" }
serde_json = "1.0.154"

[lints]
workspace = true
