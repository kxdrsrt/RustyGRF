[package]
name = "rgrf-cli"
description = "RustyGRF command line tool (`rgrf`)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "rgrf"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
rayon = "1.12.0"
rgrf-core = { path = "../rgrf-core" }
rgrf-formats = { version = "0.2.1", path = "../rgrf-formats", features = ["lossy-audio"] }
serde_json = "1.0.154"
unicode-normalization = "0.1.26"

[lints]
workspace = true
