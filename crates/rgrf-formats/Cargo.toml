[package]
name = "rgrf-formats"
description = "RustyGRF file formats of the Ragnarok Online client: SPR, (later) ACT, PAL, ..."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Edit MP3 and Ogg Vorbis sounds. LAME (MP3 encoder) is LGPL and Symphonia MPL-2.0, which the
# permissive default build avoids; the apps turn it on.
lossy-audio = ["dep:mp3lame-encoder", "dep:symphonia", "dep:vorbis_rs"]

[dependencies]
gif = "0.14.2"
mp3lame-encoder = { version = "0.3.0", optional = true }
png = "0.18.1"
rayon = "1.12.0"
symphonia = { version = "0.6.1", default-features = false, features = ["mp3", "vorbis", "ogg"], optional = true }
thiserror = "2.0.21"
vorbis_rs = { version = "0.5.6", optional = true }

[dev-dependencies]
rgrf-core = { path = "../rgrf-core" }
