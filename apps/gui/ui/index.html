<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>RustyGRF</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-open" viewBox="0 0 24 24"><path d="M3 18V6a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v2"/><path d="M3 18l2.5-7a2 2 0 0 1 1.9-1.3H21a1 1 0 0 1 .95 1.3L19.5 17a2 2 0 0 1-1.9 1.4H3z"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="i-folder-open" viewBox="0 0 24 24"><path d="M3 18V6a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v2"/><path d="M3 18l2.5-7a2 2 0 0 1 1.9-1.3H21a1 1 0 0 1 .95 1.3L19.5 17a2 2 0 0 1-1.9 1.4H3z"/></symbol>
  <symbol id="i-build" viewBox="0 0 24 24"><path d="M14 4l6 6-3 3-6-6z"/><path d="M11.5 9.5L4 17l3 3 7.5-7.5"/></symbol>
  <symbol id="i-merge" viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="13" r="2.5"/><path d="M6 8.5v7M6 9c0 3 3 4 9.5 4"/></symbol>
  <symbol id="i-extract" viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M4 20h16"/></symbol>
  <symbol id="i-verify" viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z"/><path d="M9 12l2.2 2.2L15.5 10"/></symbol>
  <symbol id="i-replace" viewBox="0 0 24 24"><path d="M4 8h14l-3-3M20 16H6l3 3"/></symbol>
  <symbol id="i-add" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-remove" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></symbol>
  <symbol id="i-interpolate" viewBox="0 0 24 24"><circle cx="4.5" cy="12" r="2"/><circle cx="19.5" cy="12" r="2"/><circle cx="12" cy="12" r="1.2"/><path d="M7.5 12h2M14.5 12h2"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></symbol>
  <symbol id="i-redo" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></symbol>
  <symbol id="i-save" viewBox="0 0 24 24"><path d="M5 3h11l4 4v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M7 3v5h8V3M7 21v-7h10v7"/></symbol>
  <symbol id="i-changes" viewBox="0 0 24 24"><path d="M4 6h10M4 12h10M4 18h6"/><path d="M16 17l2 2 4-5"/></symbol>
  <symbol id="i-reset" viewBox="0 0 24 24"><path d="M4 4v6h6"/><path d="M5.5 15a8 8 0 1 0 1.5-8.5L4 10"/></symbol>
  <symbol id="i-expand" viewBox="0 0 24 24"><path d="M7 6l5 5 5-5M7 13l5 5 5-5"/></symbol>
  <symbol id="i-collapse" viewBox="0 0 24 24"><path d="M7 11l5-5 5 5M7 18l5-5 5 5"/></symbol>
  <symbol id="i-sort-asc" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></symbol>
  <symbol id="i-sort-desc" viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></symbol>
  <symbol id="i-view-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></symbol>
  <symbol id="i-view-gallery" viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></symbol>
  <symbol id="i-view-details" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 9v11"/></symbol>
  <symbol id="i-view-tree" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="5" rx="1"/><rect x="12" y="9.5" width="9" height="5" rx="1"/><rect x="12" y="16.5" width="9" height="5" rx="1"/><path d="M6.5 8v11.5h5.5M6.5 12h5.5"/></symbol>
  <symbol id="i-view-folders" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M5 9h2M5 13h2"/></symbol>
  <symbol id="i-preview-right" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M14 4v16"/></symbol>
  <symbol id="i-preview-bottom" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 14h18"/></symbol>
  <symbol id="i-preview-off" viewBox="0 0 24 24"><path d="M3 3l18 18"/><path d="M10.6 6.2A9.8 9.8 0 0 1 12 6c5 0 8.5 4 9.5 6a14 14 0 0 1-2.6 3.3M6.4 7.6A14 14 0 0 0 2.5 12c1 2 4.5 6 9.5 6 1.5 0 2.8-.4 4-1"/></symbol>
  <symbol id="i-filter" viewBox="0 0 24 24"><path d="M4 5h16l-6 7.5V19l-4 2v-8.5z"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="M14 7l3 3"/></symbol>
  <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M4 20l1-4L16 5l3 3L8 19z"/><path d="M14 7l3 3"/></symbol>
  <symbol id="i-eraser" viewBox="0 0 24 24"><path d="M8 20h12M5 15l9-9 5 5-6 6H8z"/><path d="M9 11l5 5"/></symbol>
  <symbol id="i-fill" viewBox="0 0 24 24"><path d="M5 11l7-7 7 7-7 7z"/><path d="M5 11h14M20 15c0 1.5-1 2.5-1 3.5a1 1 0 0 0 2 0c0-1-1-2-1-3.5z"/></symbol>
  <symbol id="i-picker" viewBox="0 0 24 24"><path d="M14 6l4 4M4 20l1-4 9-9 3 3-9 9z"/><path d="M15 5l2-2 4 4-2 2"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><circle cx="12" cy="12" r="7"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5h.01"/></symbol>
  <symbol id="i-warning" viewBox="0 0 24 24"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18h.01"/></symbol>
  <symbol id="i-error" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></symbol>
  <symbol id="i-question" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.7M12 17h.01"/></symbol>
  <symbol id="i-success" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="M4 18l5-5 4 4 3-3 4 4"/></symbol>
  <symbol id="i-sprite" viewBox="0 0 24 24"><path d="M12 3l8 8-8 10-8-10z"/><path d="M4 11h16M9 11l3-8 3 8-3 10z"/></symbol>
  <symbol id="i-animation" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M10 8.5v7l6-3.5z"/></symbol>
  <symbol id="i-palette" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18c1.5 0 2-1 1.5-2.2-.6-1.3.2-2.8 1.8-2.8H17a4 4 0 0 0 4-4C21 6.5 17 3 12 3z"/><circle cx="8" cy="11" r="1"/><circle cx="12" cy="7.5" r="1"/><circle cx="16" cy="10" r="1"/></symbol>
  <symbol id="i-map" viewBox="0 0 24 24"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></symbol>
  <symbol id="i-model" viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/></symbol>
  <symbol id="i-audio" viewBox="0 0 24 24"><path d="M9 18V6l11-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></symbol>
  <symbol id="i-text" viewBox="0 0 24 24"><path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5M9 13h7M9 17h7"/></symbol>
  <symbol id="i-effect" viewBox="0 0 24 24"><path d="M12 3l2.2 5.8L20 11l-5.8 2.2L12 19l-2.2-5.8L4 11l5.8-2.2z"/></symbol>
  <symbol id="i-video" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9.5v5l4.5-2.5z"/></symbol>
  <symbol id="i-imf" viewBox="0 0 24 24"><path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5"/></symbol>
</svg>
  <header class="toolbar maintoolbar" role="toolbar" data-i18n-attrs="tb-main">
    <div class="grp" role="group" data-i18n-attrs="tb-app">
      <button id="btn-settings" type="button" data-i18n-attrs="btn-settings"><svg class="ic" aria-hidden="true"><use href="#i-settings"/></svg></button>
      <button id="btn-open" class="primary" data-i18n-attrs="btn-open"><svg class="ic" aria-hidden="true"><use href="#i-open"/></svg><span data-i18n="btn-open">Open…</span></button>
    </div>
    <div class="grp" role="group" data-i18n-attrs="tb-archive">
      <button id="btn-build" data-i18n-attrs="btn-build"><svg class="ic" aria-hidden="true"><use href="#i-build"/></svg><span data-i18n="btn-build">Build…</span></button>
      <button id="btn-merge" data-i18n-attrs="btn-merge"><svg class="ic" aria-hidden="true"><use href="#i-merge"/></svg><span data-i18n="btn-merge">Merge…</span></button>
      <button id="btn-extract" disabled data-i18n-attrs="btn-extract"><svg class="ic" aria-hidden="true"><use href="#i-extract"/></svg><span data-i18n="btn-extract">Extract…</span></button>
      <button id="btn-verify" disabled data-i18n-attrs="btn-verify"><svg class="ic" aria-hidden="true"><use href="#i-verify"/></svg><span data-i18n="btn-verify">Verify</span></button>
    </div>
    <div class="grp" role="group" data-i18n-attrs="tb-edit">
      <span class="grpmark" aria-hidden="true"><svg class="ic"><use href="#i-edit"/></svg><span data-i18n="tb-edit-mark">Edit</span></span>
      <button id="btn-add" disabled data-i18n-attrs="btn-add"><svg class="ic" aria-hidden="true"><use href="#i-add"/></svg><span data-i18n="btn-add">Add file…</span></button>
      <button id="btn-replace" disabled data-i18n-attrs="btn-replace"><svg class="ic" aria-hidden="true"><use href="#i-replace"/></svg><span data-i18n="btn-replace">Replace…</span></button>
      <button id="btn-remove" disabled data-i18n-attrs="btn-remove"><svg class="ic" aria-hidden="true"><use href="#i-remove"/></svg><span data-i18n="btn-remove">Remove</span></button>
      <button id="btn-undo" disabled data-i18n-attrs="btn-undo"><svg class="ic" aria-hidden="true"><use href="#i-undo"/></svg><span data-i18n="btn-undo">Undo</span></button>
      <button id="btn-redo" disabled data-i18n-attrs="btn-redo"><svg class="ic" aria-hidden="true"><use href="#i-redo"/></svg><span data-i18n="btn-redo">Redo</span></button>
      <button id="btn-changes" disabled data-i18n-attrs="btn-save"><svg class="ic" aria-hidden="true"><use href="#i-save"/></svg><span id="changes-label" data-i18n="btn-save">Save…</span><span id="changes-badge" class="badge" hidden>0</span></button>
    </div>
    <span class="spacer"></span>
    <input id="search" type="search" data-i18n-attrs="search" disabled autocomplete="off" spellcheck="false">
    <div class="seg" id="preview-seg" role="group" data-i18n-attrs="pv-group">
      <button type="button" data-preview="right" data-i18n-attrs="pv-right"><svg class="ic" aria-hidden="true"><use href="#i-preview-right"/></svg><span class="sr" data-i18n="pv-right">Right</span></button>
      <button type="button" data-preview="bottom" data-i18n-attrs="pv-bottom"><svg class="ic" aria-hidden="true"><use href="#i-preview-bottom"/></svg><span class="sr" data-i18n="pv-bottom">Bottom</span></button>
      <button type="button" data-preview="off" data-i18n-attrs="pv-off"><svg class="ic" aria-hidden="true"><use href="#i-preview-off"/></svg><span class="sr" data-i18n="pv-off">Off</span></button>
    </div>
  </header>

  <div class="toolbar viewbar" role="toolbar" data-i18n-attrs="tb-view">
    <div class="seg" id="view-seg" role="group" data-i18n-attrs="view-group">
      <button type="button" data-layout="tree" data-i18n-attrs="view-tree"><svg class="ic" aria-hidden="true"><use href="#i-view-tree"/></svg><span data-i18n="view-tree">Tree</span></button>
      <button type="button" data-layout="details" data-i18n-attrs="view-details"><svg class="ic" aria-hidden="true"><use href="#i-view-details"/></svg><span data-i18n="view-details">Details</span></button>
      <button type="button" data-layout="folders" data-i18n-attrs="view-folders"><svg class="ic" aria-hidden="true"><use href="#i-view-folders"/></svg><span data-i18n="view-folders">Folders</span></button>
      <button type="button" data-layout="gallery" data-i18n-attrs="view-gallery"><svg class="ic" aria-hidden="true"><use href="#i-view-gallery"/></svg><span data-i18n="view-gallery">Gallery</span></button>
    </div>
    <label class="muted" for="sort"><span class="lbl" data-i18n="sort">Sort</span>
      <select id="sort" disabled>
        <option value="archive" data-i18n="sort-archive">Stored order</option>
        <option value="name" data-i18n="sort-name">Name</option>
        <option value="path" data-i18n="sort-path">Path</option>
        <option value="type" data-i18n="sort-type">Type</option>
        <option value="size" data-i18n="sort-size">Size</option>
        <option value="stored" data-i18n="sort-stored">Stored size</option>
        <option value="offset" data-i18n="sort-offset">Position in file</option>
      </select>
    </label>
    <button id="sort-dir" type="button" disabled data-i18n-attrs="sort-dir"><svg class="ic" aria-hidden="true"><use id="sort-dir-use" href="#i-sort-asc"/></svg></button>
    <details id="kind-filter" class="pop">
      <summary class="btnlike" data-i18n-attrs="kind-filter-title"><svg class="ic" aria-hidden="true"><use href="#i-filter"/></svg><span id="kind-label">Type: all</span></summary>
      <div class="popbody" id="kind-list"></div>
    </details>
    <label class="muted" for="size-filter"><span class="lbl" data-i18n="size">Size</span>
      <select id="size-filter" disabled>
        <option value="" data-i18n="size-any">any</option>
        <option value="1k-" data-i18n="size-over-1k">over 1 KB</option>
        <option value="100k-" data-i18n="size-over-100k">over 100 KB</option>
        <option value="1m-" data-i18n="size-over-1m">over 1 MB</option>
        <option value="10m-" data-i18n="size-over-10m">over 10 MB</option>
        <option value="-1k" data-i18n="size-under-1k">under 1 KB</option>
        <option value="-100k" data-i18n="size-under-100k">under 100 KB</option>
        <option value="-1m" data-i18n="size-under-1m">under 1 MB</option>
      </select>
    </label>
    <label id="recursive-wrap" class="muted" hidden data-i18n-attrs="subfolders"><input type="checkbox" id="recursive"> <span data-i18n="subfolders">Subfolders</span></label>
    <button id="btn-expand" type="button" hidden data-i18n-attrs="expand-all"><svg class="ic" aria-hidden="true"><use href="#i-expand"/></svg><span data-i18n="expand-all">Expand all</span></button>
    <button id="btn-collapse" type="button" hidden data-i18n-attrs="collapse-all"><svg class="ic" aria-hidden="true"><use href="#i-collapse"/></svg><span data-i18n="collapse-all">Collapse all</span></button>
    <button id="btn-reset-filters" type="button" disabled data-i18n-attrs="reset-filters"><svg class="ic" aria-hidden="true"><use href="#i-reset"/></svg><span data-i18n="reset-filters">Reset</span></button>
  </div>

  <main class="pv-right">
    <section id="list-pane" data-i18n-attrs="entries-list">
      <div id="empty" class="empty">
        <h1>RustyGRF</h1>
        <p data-i18n="empty-hint">Open a GRF archive, or drop it on this window.</p>
        <button id="btn-open-2" class="primary" data-i18n-attrs="open-archive"><svg class="ic" aria-hidden="true"><use href="#i-open"/></svg><span data-i18n="open-archive">Open archive…</span></button>
      </div>
      <div id="lists" hidden>
        <div id="folder-pane" hidden data-i18n-attrs="folders-pane">
          <button type="button" id="folder-all" class="folder-all" data-i18n-attrs="all-files"><svg class="ic" aria-hidden="true"><use href="#i-folder-open"/></svg><span data-i18n="all-files">All files</span></button>
          <div id="folder-viewport" tabindex="0" role="tree" data-i18n-attrs="folders-pane">
            <div id="folder-spacer"><div id="folder-rows"></div></div>
          </div>
        </div>
        <div id="split-folders" class="split v" hidden role="separator" aria-orientation="vertical" data-i18n-attrs="split-folders" tabindex="0"></div>
        <div id="files-pane">
          <div id="colhead" hidden>
            <span></span>
            <button type="button" data-sort="name" data-i18n="col-name">Name</button>
            <button type="button" data-sort="type" data-i18n="col-type">Type</button>
            <button type="button" data-sort="size" data-i18n="col-size">Size</button>
            <button type="button" data-sort="stored" data-i18n="col-stored">Stored</button>
          </div>
          <div id="viewport" tabindex="0" role="listbox" data-i18n-attrs="entries-list">
            <div id="spacer"><div id="rows"></div></div>
          </div>
        </div>
      </div>
    </section>
    <div id="split-main" class="split v" role="separator" aria-orientation="vertical" data-i18n-attrs="split-preview" tabindex="0"></div>
    <section id="preview-pane" data-i18n-attrs="preview-pane">
      <div id="preview-head"></div>
      <div id="preview-body"></div>
    </section>
  </main>

  <footer class="statusbar">
    <span id="status" role="status" aria-live="polite" data-i18n="status-ready">Ready</span>
    <span id="count" class="muted" aria-live="polite"></span>
    <label class="muted" for="names" data-i18n-attrs="names"><span class="lbl" data-i18n="names">Names</span>
      <select id="names" disabled>
        <option value="cp949" selected data-i18n="names-korean">Korean</option>
        <option value="cp1252">Latin-1</option>
        <option value="utf8">UTF-8</option>
      </select>
    </label>
  </footer>

  <dialog id="act-dlg" class="wide">
    <h2 id="act-title" data-i18n="dlg-edit-animation">Edit animation</h2>
    <div id="act-body"></div>
    <form method="dialog" class="dlg-actions"><button id="act-close" class="primary" data-i18n="dlg-close">Close</button></form>
  </dialog>

  <dialog id="settings-dlg" class="wide" aria-labelledby="settings-title">
    <h2 id="settings-title"></h2>
    <div id="settings-body" tabindex="0" role="group" data-i18n-attrs="set-title"></div>
    <form method="dialog" class="dlg-actions" id="settings-actions"></form>
  </dialog>

  <dialog id="pix-dlg" class="wide" aria-labelledby="pix-title">
    <h2 id="pix-title" data-i18n="dlg-edit-pixels">Edit pixels</h2>
    <div id="pix-body"></div>
    <form method="dialog" class="dlg-actions" id="pix-actions"></form>
  </dialog>

  <dialog id="text-dlg" class="wide">
    <h2 id="text-title" data-i18n="dlg-edit-text">Edit text</h2>
    <div id="text-body"></div>
    <form method="dialog" class="dlg-actions"><button id="text-close" data-i18n="dlg-close">Close</button></form>
  </dialog>

  <dialog id="dlg">
    <h2 id="dlg-title"></h2>
    <div id="dlg-body"></div>
    <form method="dialog" class="dlg-actions" id="dlg-actions"></form>
  </dialog>

  <script src="i18n.js"></script>
  <script src="mock.js"></script>
  <script src="viewer3d.js"></script>
  <script src="app.js"></script>
</body>
</html>
