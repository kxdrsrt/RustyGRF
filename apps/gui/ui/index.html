<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>RustyGRF</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-open" viewBox="0 0 24 24"><path d="M3 18V6a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v2"/><path d="M3 18l2.5-7a2 2 0 0 1 1.9-1.3H21a1 1 0 0 1 .95 1.3L19.5 17a2 2 0 0 1-1.9 1.4H3z"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="i-folder-open" viewBox="0 0 24 24"><path d="M3 18V6a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v2"/><path d="M3 18l2.5-7a2 2 0 0 1 1.9-1.3H21a1 1 0 0 1 .95 1.3L19.5 17a2 2 0 0 1-1.9 1.4H3z"/></symbol>
  <symbol id="i-build" viewBox="0 0 24 24"><path d="M14 4l6 6-3 3-6-6z"/><path d="M11.5 9.5L4 17l3 3 7.5-7.5"/></symbol>
  <symbol id="i-merge" viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="13" r="2.5"/><path d="M6 8.5v7M6 9c0 3 3 4 9.5 4"/></symbol>
  <symbol id="i-extract" viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M4 20h16"/></symbol>
  <symbol id="i-verify" viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z"/><path d="M9 12l2.2 2.2L15.5 10"/></symbol>
  <symbol id="i-replace" viewBox="0 0 24 24"><path d="M4 8h14l-3-3M20 16H6l3 3"/></symbol>
  <symbol id="i-add" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-remove" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></symbol>
  <symbol id="i-redo" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></symbol>
  <symbol id="i-changes" viewBox="0 0 24 24"><path d="M4 6h10M4 12h10M4 18h6"/><path d="M16 17l2 2 4-5"/></symbol>
  <symbol id="i-reset" viewBox="0 0 24 24"><path d="M4 4v6h6"/><path d="M5.5 15a8 8 0 1 0 1.5-8.5L4 10"/></symbol>
  <symbol id="i-expand" viewBox="0 0 24 24"><path d="M7 6l5 5 5-5M7 13l5 5 5-5"/></symbol>
  <symbol id="i-collapse" viewBox="0 0 24 24"><path d="M7 11l5-5 5 5M7 18l5-5 5 5"/></symbol>
  <symbol id="i-sort-asc" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></symbol>
  <symbol id="i-sort-desc" viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></symbol>
  <symbol id="i-view-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></symbol>
  <symbol id="i-view-details" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 9v11"/></symbol>
  <symbol id="i-view-tree" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="5" rx="1"/><rect x="12" y="9.5" width="9" height="5" rx="1"/><rect x="12" y="16.5" width="9" height="5" rx="1"/><path d="M6.5 8v11.5h5.5M6.5 12h5.5"/></symbol>
  <symbol id="i-view-folders" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M5 9h2M5 13h2"/></symbol>
  <symbol id="i-preview-right" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M14 4v16"/></symbol>
  <symbol id="i-preview-bottom" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 14h18"/></symbol>
  <symbol id="i-preview-off" viewBox="0 0 24 24"><path d="M3 3l18 18"/><path d="M10.6 6.2A9.8 9.8 0 0 1 12 6c5 0 8.5 4 9.5 6a14 14 0 0 1-2.6 3.3M6.4 7.6A14 14 0 0 0 2.5 12c1 2 4.5 6 9.5 6 1.5 0 2.8-.4 4-1"/></symbol>
  <symbol id="i-filter" viewBox="0 0 24 24"><path d="M4 5h16l-6 7.5V19l-4 2v-8.5z"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="M14 7l3 3"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="M4 18l5-5 4 4 3-3 4 4"/></symbol>
  <symbol id="i-sprite" viewBox="0 0 24 24"><path d="M12 3l8 8-8 10-8-10z"/><path d="M4 11h16M9 11l3-8 3 8-3 10z"/></symbol>
  <symbol id="i-animation" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M10 8.5v7l6-3.5z"/></symbol>
  <symbol id="i-palette" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18c1.5 0 2-1 1.5-2.2-.6-1.3.2-2.8 1.8-2.8H17a4 4 0 0 0 4-4C21 6.5 17 3 12 3z"/><circle cx="8" cy="11" r="1"/><circle cx="12" cy="7.5" r="1"/><circle cx="16" cy="10" r="1"/></symbol>
  <symbol id="i-map" viewBox="0 0 24 24"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></symbol>
  <symbol id="i-model" viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/></symbol>
  <symbol id="i-audio" viewBox="0 0 24 24"><path d="M9 18V6l11-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></symbol>
  <symbol id="i-text" viewBox="0 0 24 24"><path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5M9 13h7M9 17h7"/></symbol>
  <symbol id="i-effect" viewBox="0 0 24 24"><path d="M12 3l2.2 5.8L20 11l-5.8 2.2L12 19l-2.2-5.8L4 11l5.8-2.2z"/></symbol>
  <symbol id="i-video" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9.5v5l4.5-2.5z"/></symbol>
  <symbol id="i-imf" viewBox="0 0 24 24"><path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5"/></symbol>
</svg>
  <header class="toolbar">
    <button id="btn-open" class="primary"><svg class="ic" aria-hidden="true"><use href="#i-open"/></svg><span>Open…</span></button>
    <input id="search" type="search" placeholder="Search: a name, or a pattern like *.spr" disabled autocomplete="off" spellcheck="false">
    <span id="count" class="muted" aria-live="polite"></span>
    <span class="spacer"></span>
    <label class="muted" for="names" title="How file names are shown and searched. Extracting always writes Latin-1 names, so the result matches `rgrf build`.">Names
      <select id="names" disabled>
        <option value="cp949" selected>Korean</option>
        <option value="cp1252">Latin-1</option>
        <option value="utf8">UTF-8</option>
      </select>
    </label>
    <button id="btn-build" title="Pack a folder into a new GRF"><svg class="ic" aria-hidden="true"><use href="#i-build"/></svg><span>Build…</span></button>
    <button id="btn-merge" title="Merge several GRFs into a new one"><svg class="ic" aria-hidden="true"><use href="#i-merge"/></svg><span>Merge…</span></button>
    <button id="btn-extract" disabled><svg class="ic" aria-hidden="true"><use href="#i-extract"/></svg><span>Extract…</span></button>
    <button id="btn-verify" disabled><svg class="ic" aria-hidden="true"><use href="#i-verify"/></svg><span>Verify</span></button>
  </header>

  <div class="toolbar editbar" aria-label="Edit">
    <span class="muted">Edit</span>
    <button id="btn-replace" disabled title="Replace the selected entry with a file from disk"><svg class="ic" aria-hidden="true"><use href="#i-replace"/></svg><span>Replace…</span></button>
    <button id="btn-add" disabled title="Add a file from disk under a path in the archive"><svg class="ic" aria-hidden="true"><use href="#i-add"/></svg><span>Add file…</span></button>
    <button id="btn-remove" disabled title="Leave the selected entry out of the saved archive"><svg class="ic" aria-hidden="true"><use href="#i-remove"/></svg><span>Remove</span></button>
    <span class="spacer"></span>
    <button id="btn-undo" disabled title="Undo the last staged change (Cmd/Ctrl+Z)"><svg class="ic" aria-hidden="true"><use href="#i-undo"/></svg><span>Undo</span></button>
    <button id="btn-redo" disabled title="Redo (Shift+Cmd/Ctrl+Z)"><svg class="ic" aria-hidden="true"><use href="#i-redo"/></svg><span>Redo</span></button>
    <button id="btn-changes" disabled title="Review and save the pending changes as a new archive"><svg class="ic" aria-hidden="true"><use href="#i-changes"/></svg><span id="changes-label">Changes (0)…</span></button>
  </div>

  <div class="toolbar viewbar" aria-label="View">
    <span class="muted">View</span>
    <div class="seg" id="view-seg" role="group" aria-label="List layout">
      <button type="button" data-layout="list" title="Flat list: name, folder, size"><svg class="ic" aria-hidden="true"><use href="#i-view-list"/></svg><span>List</span></button>
      <button type="button" data-layout="details" title="Flat table with sortable columns"><svg class="ic" aria-hidden="true"><use href="#i-view-details"/></svg><span>Details</span></button>
      <button type="button" data-layout="tree" title="Folder tree with files"><svg class="ic" aria-hidden="true"><use href="#i-view-tree"/></svg><span>Tree</span></button>
      <button type="button" data-layout="folders" title="Folders on the left, the files of the chosen folder on the right"><svg class="ic" aria-hidden="true"><use href="#i-view-folders"/></svg><span>Folders</span></button>
    </div>
    <label class="muted" for="sort">Sort
      <select id="sort" disabled>
        <option value="archive">Stored order</option>
        <option value="name">Name</option>
        <option value="path">Path</option>
        <option value="type">Type</option>
        <option value="size">Size</option>
        <option value="stored">Stored size</option>
        <option value="offset">Position in file</option>
      </select>
    </label>
    <button id="sort-dir" type="button" disabled title="Ascending or descending" aria-label="Sort direction"><svg class="ic" aria-hidden="true"><use id="sort-dir-use" href="#i-sort-asc"/></svg></button>
    <details id="kind-filter" class="pop">
      <summary class="btnlike" title="Show only some kinds of file"><svg class="ic" aria-hidden="true"><use href="#i-filter"/></svg><span id="kind-label">Type: all</span></summary>
      <div class="popbody" id="kind-list"></div>
    </details>
    <label class="muted" for="size-filter">Size
      <select id="size-filter" disabled>
        <option value="">any</option>
        <option value="1k-">over 1 KB</option>
        <option value="100k-">over 100 KB</option>
        <option value="1m-">over 1 MB</option>
        <option value="10m-">over 10 MB</option>
        <option value="-1k">under 1 KB</option>
        <option value="-100k">under 100 KB</option>
        <option value="-1m">under 1 MB</option>
      </select>
    </label>
    <label id="recursive-wrap" class="muted" hidden title="Also list the files of the subfolders"><input type="checkbox" id="recursive"> Subfolders</label>
    <button id="btn-expand" type="button" hidden title="Open every folder"><svg class="ic" aria-hidden="true"><use href="#i-expand"/></svg><span>Expand all</span></button>
    <button id="btn-collapse" type="button" hidden title="Close every folder"><svg class="ic" aria-hidden="true"><use href="#i-collapse"/></svg><span>Collapse all</span></button>
    <button id="btn-reset-filters" type="button" disabled title="Clear search, type and size filters"><svg class="ic" aria-hidden="true"><use href="#i-reset"/></svg><span>Reset</span></button>
    <span class="spacer"></span>
    <span class="muted">Preview</span>
    <div class="seg" id="preview-seg" role="group" aria-label="Preview position">
      <button type="button" data-preview="right" title="Preview beside the list" aria-label="Preview on the right"><svg class="ic" aria-hidden="true"><use href="#i-preview-right"/></svg><span class="sr">Right</span></button>
      <button type="button" data-preview="bottom" title="Preview below the list" aria-label="Preview at the bottom"><svg class="ic" aria-hidden="true"><use href="#i-preview-bottom"/></svg><span class="sr">Bottom</span></button>
      <button type="button" data-preview="off" title="Hide the preview (Cmd/Ctrl+Shift+P)" aria-label="Hide the preview"><svg class="ic" aria-hidden="true"><use href="#i-preview-off"/></svg><span class="sr">Off</span></button>
    </div>
  </div>

  <main class="pv-right">
    <section id="list-pane" aria-label="Entries">
      <div id="empty" class="empty">
        <h1>RustyGRF</h1>
        <p>Open a GRF archive, or drop it on this window.</p>
        <button id="btn-open-2" class="primary"><svg class="ic" aria-hidden="true"><use href="#i-open"/></svg><span>Open archive…</span></button>
      </div>
      <div id="lists" hidden>
        <div id="folder-pane" hidden aria-label="Folders">
          <button type="button" id="folder-all" class="folder-all" title="Show the files of every folder"><svg class="ic" aria-hidden="true"><use href="#i-folder-open"/></svg><span>All files</span></button>
          <div id="folder-viewport" tabindex="0" role="tree" aria-label="Folders">
            <div id="folder-spacer"><div id="folder-rows"></div></div>
          </div>
        </div>
        <div id="split-folders" class="split v" hidden role="separator" aria-orientation="vertical" aria-label="Resize the folder list" tabindex="0"></div>
        <div id="files-pane">
          <div id="colhead" hidden>
            <span></span>
            <button type="button" data-sort="name">Name</button>
            <button type="button" data-sort="type">Type</button>
            <button type="button" data-sort="size">Size</button>
            <button type="button" data-sort="stored">Stored</button>
          </div>
          <div id="viewport" tabindex="0" role="listbox" aria-label="Entries">
            <div id="spacer"><div id="rows"></div></div>
          </div>
        </div>
      </div>
    </section>
    <div id="split-main" class="split v" role="separator" aria-orientation="vertical" aria-label="Resize the preview (arrow keys)" title="Drag to resize, or focus and use the arrow keys" tabindex="0"></div>
    <section id="preview-pane" aria-label="Preview">
      <div id="preview-head"></div>
      <div id="preview-body"></div>
    </section>
  </main>

  <footer id="status" role="status" aria-live="polite">Ready</footer>

  <dialog id="act-dlg" class="wide">
    <h2 id="act-title">Edit animation</h2>
    <div id="act-body"></div>
    <form method="dialog" class="dlg-actions"><button id="act-close" class="primary">Close</button></form>
  </dialog>

  <dialog id="text-dlg" class="wide">
    <h2 id="text-title">Edit text</h2>
    <div id="text-body"></div>
    <form method="dialog" class="dlg-actions"><button id="text-close">Close</button></form>
  </dialog>

  <dialog id="dlg">
    <h2 id="dlg-title"></h2>
    <div id="dlg-body"></div>
    <form method="dialog" class="dlg-actions" id="dlg-actions"></form>
  </dialog>

  <script src="mock.js"></script>
  <script src="viewer3d.js"></script>
  <script src="app.js"></script>
</body>
</html>
