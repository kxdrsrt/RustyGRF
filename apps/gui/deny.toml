[graph]
all-features = true

[advisories]
version = 2
# RUSTSEC-2024-0370: proc-macro-error is unmaintained (not vulnerable). It is a build-time macro
# of gtk3-rs (glib-macros 0.18), pulled in by Tauri on Linux only; nothing to fix on our side.
#
# RUSTSEC-2026-0370/0371/0372: zvariant, zbus_names and zvariant_derive are marked unmaintained
# (not vulnerable). They come from the official tauri-plugin-single-instance, only on Linux (D-Bus),
# and nothing in them is reachable from file data. Revisit when the plugin moves to zbus' successor.
ignore = ["RUSTSEC-2024-0370", "RUSTSEC-2026-0370", "RUSTSEC-2026-0371", "RUSTSEC-2026-0372"]

# Same list as the main project (../../deny.toml) plus what Tauri's dependency tree needs:
# - MPL-2.0 (cssparser, selectors, dtoa-short, option-ext): file-level copyleft; the crates are
#   used unmodified, so only their own files stay under MPL-2.0. See docs/05-licensing.md.
# - 0BSD, MIT-0, Unlicense, LGPL-2.1-or-later: only as one option of a dual licence
#   (adler2, dunce, memchr/walkdir, r-efi), the MIT/Apache option is the one used.
[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "0BSD",
    "MIT-0",
    "Unlicense",
    "LGPL-2.1-or-later",
]
confidence-threshold = 0.9

# The sound editor for MP3 and Ogg (feature lossy-audio, see docs/05-licensing.md): LAME is
# LGPL, Symphonia is MPL-2.0 (file-level copyleft, used unmodified). The permissive default build
# of the libraries does not contain them.
[[licenses.exceptions]]
allow = ["LGPL-3.0"]
crate = "mp3lame-encoder"

[[licenses.exceptions]]
allow = ["LGPL-3.0"]
crate = "mp3lame-sys"

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
