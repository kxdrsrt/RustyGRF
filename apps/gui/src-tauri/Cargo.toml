[package]
name = "rustygrf-gui"
description = "RustyGRF desktop app (Tauri 2)"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["The RustyGRF Authors"]
publish = false

[lib]
name = "rustygrf_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.5", features = [] }

[dependencies]
base64 = "0.23.1"
encoding_rs = "0.8.44"
rgrf-core = { version = "0.0.0", path = "../../../crates/rgrf-core" }
rgrf-formats = { version = "0.0.0", path = "../../../crates/rgrf-formats" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.6", features = [] }
tauri-plugin-dialog = "2.8.4"
