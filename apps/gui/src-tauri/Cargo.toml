[package]
name = "rustygrf-gui"
description = "RustyGRF desktop app (Tauri 2)"
version = "0.2.1"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["The RustyGRF Authors"]
publish = false
default-run = "rustygrf-gui"

[lib]
name = "rustygrf_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# `devserver`: serves the page with the real backend on localhost, so the UI can be tested in a
# browser without opening a window (see src/bin/devserver.rs). Not part of the app.
devserver = []

[[bin]]
name = "rustygrf-gui"
path = "src/main.rs"

[[bin]]
name = "devserver"
path = "src/bin/devserver.rs"
required-features = ["devserver"]

[build-dependencies]
tauri-build = { version = "2.7.5", features = [] }

[dependencies]
base64 = "0.23.1"
encoding_rs = "0.8.44"
rayon = "1.12.0"
regex = "1.13.1"
rgrf-core = { version = "0.2.1", path = "../../../crates/rgrf-core" }
rgrf-formats = { version = "0.2.1", path = "../../../crates/rgrf-formats", features = ["lossy-audio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tauri = { version = "2.12.6", features = [] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-single-instance = "2.5.5"
