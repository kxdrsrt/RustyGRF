[package]
name = "rgrf-lua-verify"
description = "Checks the Lua decompiler of rgrf-formats against a real Lua 5.1 (development tool, not shipped)"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["The RustyGRF Authors"]
publish = false

# Its own workspace: it needs `unsafe` (mlua's debug library and binary chunks) and a C build of
# Lua, which the library, CLI and MCP server must not depend on.
[workspace]
resolver = "3"

[dependencies]
mlua = { version = "0.12.2", features = ["lua51", "vendored"] }
rayon = "1.12.0"
rgrf-core = { path = "../../crates/rgrf-core" }
rgrf-formats = { path = "../../crates/rgrf-formats" }

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 3
