[workspace]
resolver = "3"
members = ["crates/rgrf-core", "crates/rgrf-formats", "crates/rgrf-cli", "crates/rgrf-mcp"]
exclude = ["apps/gui", "tools/lua-verify"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["The RustyGRF Authors"]
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1

# Dependencies (zlib, LZMA, MD5) optimized even in debug builds, otherwise tests on real archives crawl.
[profile.dev.package."*"]
opt-level = 3
